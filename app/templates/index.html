<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>DG1 – Hoang Nhat Thang – 2412111007</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>DG1 – Hoang Nhat Thang – 2412111007</h1>
        <h2>Danh sách sinh viên</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>MSSV</th>
                    <th>Họ tên</th>
                    <th>Lớp</th>
                    <th>Điểm</th>
                </tr>
            </thead>
            <tbody>
                {% for sv in students %}
                <tr>
                    <td>{{ sv.id }}</td>
                    <td>{{ sv.mssv }}</td>
                    <td>{{ sv.ho_ten }}</td>
                    <td>{{ sv.lop }}</td>
                    <td>{{ sv.diem }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
