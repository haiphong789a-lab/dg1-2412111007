services:
  web:
    build: .
    environment:
      - PORT=5000
      - MSSV=2412111007
    volumes:
      - ./app/data:/usr/src/app/app/data

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
